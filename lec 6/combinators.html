<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <!-- descendant selector= select all element inside the block at once-->
        <p>Paragraph 1</p>
        <p>hello world</p>
    </div>
    <div><!--child selector-->
        <p>direct child</p>
        <section>
            <p>nested child</p>
        </section>
    </div>
    <!-- Adjacent selector-->
    <h1>I'm IronMan</h1>
    <p>I'm SpiderMan</p>
    <p>i'm not her man</p>
    
    <input type="text">
    <input type="password">
    
</body>
</html>
